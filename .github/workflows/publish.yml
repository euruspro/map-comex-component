name: Publicar en npm

# Se publica en npmjs.com (público) al empujar un tag vX.Y.Z que coincida con la versión de
# package.json. Versiones con guion (p. ej. v0.2.0-beta.1) salen con el dist-tag "next".
#
# Autenticación: Trusted Publishing (OIDC, sin token guardado). npm lo configura en
# npmjs.com → paquete → Settings → Trusted Publisher (repositorio euruspro/map-comex-component,
# workflow publish.yml). Si el paquete todavía no existe en npm, la primera versión puede salir con
# el secret NPM_TOKEN (token granular de publicación); después se borra el secret y queda solo OIDC.
# Con el repositorio público, npm agrega además la procedencia (provenance) automáticamente.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # Trusted Publishing (OIDC) y procedencia

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar paquete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing requiere npm >= 11.5.1 (Node 22 trae npm 10).
      - name: npm con Trusted Publishing
        run: npm install -g npm@11.6.2
      - run: npm ci
      - name: El tag coincide con la versión
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::El tag ${GITHUB_REF_NAME} no coincide con package.json (v${version})."
            exit 1
          fi
      - name: Verificar (lint, tipos, pruebas, licencia)
        run: npm run lint && npm run type-check && npm test && npm run check:license
      # Se publica el mismo tarball que se empaqueta aquí y se deja su integridad (sha512) en el
      # resumen del job: los proyectos consumidores pueden validar su package-lock.json contra ella.
      - name: Empaquetar
        id: pack
        run: |
          npm pack --json > pack.json
          echo "file=$(node -p "require('./pack.json')[0].filename")" >> "$GITHUB_OUTPUT"
          {
            echo "### ${GITHUB_REF_NAME}"
            echo
            echo "- Tarball: \`$(node -p "require('./pack.json')[0].filename")\`"
            echo "- Integridad: \`$(node -p "require('./pack.json')[0].integrity")\`"
          } >> "$GITHUB_STEP_SUMMARY"
          node -p "'integrity=' + require('./pack.json')[0].integrity"
      - name: Publicar
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) npm publish "${{ steps.pack.outputs.file }}" --access public --tag next --ignore-scripts ;;
            *) npm publish "${{ steps.pack.outputs.file }}" --access public --ignore-scripts ;;
          esac
        env:
          # Vacío si no existe el secret: entonces npm usa solo OIDC (Trusted Publishing).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
